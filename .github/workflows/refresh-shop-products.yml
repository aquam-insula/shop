name: Refresh shop products

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-shop-products
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download live catalogue
        shell: bash
        run: |
          set -euo pipefail
          url='https://script.google.com/macros/s/AKfycbxpg0ptxrXsGXO6vmir-RxK5mHQ_I5XdFPxNeIp9uDgPumGxz9c9ATs_r51Mr4R4UpONA/exec?action=getProductsFromSheet'
          curl --fail --location --retry 3 --retry-delay 5 --max-time 120 "$url" --output data/shop_products.json.new
          python -m json.tool data/shop_products.json.new > /dev/null
          mv data/shop_products.json.new data/shop_products.json

      - name: Publish catalogue change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/shop_products.json; then
            echo 'Catalogue is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/shop_products.json
          git commit -m 'Refresh shop product catalogue'
          git push
