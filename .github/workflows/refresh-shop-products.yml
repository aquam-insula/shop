name: Refresh shop products

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-shop-products
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download live catalogue
        shell: bash
        run: |
          set -euo pipefail
          base_url='https://script.google.com/macros/s/AKfycbxpg0ptxrXsGXO6vmir-RxK5mHQ_I5XdFPxNeIp9uDgPumGxz9c9ATs_r51Mr4R4UpONA/exec?action=getProductsFromSheet'
          output='data/shop_products.json.new'
          rm -f "$output"

          for attempt in 1 2 3; do
            echo "Catalogue download attempt ${attempt}/3"
            url="${base_url}&refresh=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"

            if curl --fail-with-body --location --connect-timeout 20 --max-time 120 "$url" --output "$output"; then
              if python -m json.tool "$output" > /dev/null; then
                mv "$output" data/shop_products.json
                exit 0
              fi
              echo 'Downloaded response was not valid JSON.'
            fi

            rm -f "$output"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done

          echo 'Catalogue download failed after 3 attempts.'
          exit 1

      - name: Publish catalogue change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/shop_products.json; then
            echo 'Catalogue is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/shop_products.json
          git commit -m 'Refresh shop product catalogue'
          git push
