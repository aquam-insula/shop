name: Refresh shop products

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-shop-products
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download live catalogue from FBM
        shell: bash
        run: |
          set -euo pipefail
          # FBM Products is the in-house shop source. Equipment List Apps Script is retired.
          base_url='https://fbm.framesoft.com/api/v1/public/shop-inhouse-catalog'
          output='data/shop_products.json.new'
          rm -f "$output"

          for attempt in 1 2 3; do
            echo "Catalogue download attempt ${attempt}/3"
            url="${base_url}?refresh=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"

            if curl --fail-with-body --location --connect-timeout 20 --max-time 180 "$url" --output "$output"; then
              if python -c "import json; data=json.load(open('$output', encoding='utf-8')); assert isinstance(data, list) and len(data) >= 100"; then
                mv "$output" data/shop_products.json
                exit 0
              fi
              echo 'Downloaded response was not a valid FBM shop catalogue.'
            fi

            rm -f "$output"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done

          echo 'FBM catalogue download failed after 3 attempts.'
          exit 1

      - name: Publish catalogue change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/shop_products.json; then
            echo 'Catalogue is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/shop_products.json
          git commit -m 'Refresh shop product catalogue from FBM'
          git push
